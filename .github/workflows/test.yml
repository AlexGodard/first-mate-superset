name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure test Git identity
        run: |
          git config --global user.name "First Mate CI"
          git config --global user.email "first-mate-ci@example.invalid"

      - name: Install ShellCheck 0.11.0
        run: |
          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

      - name: Run tests
        run: bash tests/run.sh
